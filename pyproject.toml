[tool.poetry]
name = "thesis"
version = "1.0.0"
description = ""
authors = ["Milan Tichavský <milantichavsky@seznam.cz>"]
readme = "README.md"
package-mode = false

[[tool.poetry.source]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.12"
numpy = "*"
torch = {version = "^2.6.0", source = "pytorch-cuda"}
scipy = "*"
scikit-learn = "*"
pandas = "*"
matplotlib = "*"
mne = "*"
mne-icalabel = "*"
librosa = "*"
einops = "*"
pip-tools = "^7.5.3"

[tool.poetry.group.api]
optional = true

[tool.poetry.group.api.dependencies]
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
python-multipart = "*"
pydantic = "*"
pydantic-settings = "*"
slowapi = "*"
structlog = "*"

[tool.poetry.group.dev.dependencies]
ruff = "*"
ipykernel = "*"
jupyter = "*"
mypy = "*"
pandas-stubs = "*"
pytest = "*"
scipy-stubs = "*"
pip-tools = "*"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
lint.select = ["I", "E", "F"]
fix = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

# Allow untyped calls for third-party libraries without stubs
[[tool.mypy.overrides]]
module = [
    "mne.*",
    "mne_icalabel.*",
    "scipy.*",
    "sklearn.*",
    "matplotlib.*",
    "librosa.*",
    "slowapi.*",
    "structlog.*",
]
ignore_missing_imports = true

# Vendored third-party files (CBCR License) — suppress all mypy errors
[[tool.mypy.overrides]]
module = [
    "thesis.deformer",
    "thesis.lggnet",
    "thesis.tsception",
]
ignore_errors = true
